# Запуск бота: docker compose up -d --build
# Логи:       docker compose logs -f
# Остановка:  docker compose down

services:
  bot:
    build: .
    container_name: ai-helper
    image: ai-helper:latest

    # Переменные подтягиваются из .env при старте и остаются снаружи образа.
    env_file: .env

    volumes:
      # Самая важная строка файла. Файловая система контейнера уничтожается
      # при каждой пересборке — без этой строки база с напоминаниями исчезала
      # бы при каждом обновлении. Папка с хоста живёт отдельно от образа.
      - ./data:/app/data

    # Поднять контейнер после падения процесса и после перезагрузки сервера,
    # но не после ручной остановки (docker compose stop).
    restart: unless-stopped

    # По умолчанию Docker пишет логи без ограничений и со временем забивает
    # диск сервера. Держим три файла по 10 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Сколько ждать корректного завершения после SIGTERM, прежде чем убить.
    # Боту нужно закрыть соединение с базой, чтобы не повредить файл SQLite.
    stop_grace_period: 15s

# Портов нет намеренно: бот сам стучится в Telegram (long polling), входящие
# соединения ему не нужны. Меньше открытых дверей на сервере.
