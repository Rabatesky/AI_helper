# Запуск бота: docker compose up -d --build
# Логи:       docker compose logs -f
# Остановка:  docker compose down

services:
  bot:
    build: .
    container_name: ai-helper
    image: ai-helper:latest

    # Переменные подтягиваются из .env при старте и остаются снаружи образа.
    env_file: .env

    volumes:
      # Самая важная строка файла. Файловая система контейнера уничтожается
      # при каждой пересборке — без этой строки база с напоминаниями исчезала
      # бы при каждом обновлении. Папка с хоста живёт отдельно от образа.
      - ./data:/app/data

    # --- Ограничение возможностей внутри контейнера --------------------------
    # Смысл этих настроек не в том, чтобы «не пустить внутрь» — снаружи бот и
    # так недоступен, портов нет. Смысл в том, чтобы сузить возможности того,
    # кто гипотетически внутри окажется: через уязвимость в зависимости или
    # в самом коде.

    # Файловая система только на чтение. Записать внутрь свой файл и запустить
    # его не получится. Боту писать некуда, кроме подключённой data, — ничего
    # не ломается.
    read_only: true

    # Единственное исключение: временная папка в памяти. Нужна на случай, если
    # библиотекам понадобится временный файл. noexec запрещает запуск оттуда.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # Снять все привилегии Linux. Боту не нужна ни одна из них: он не слушает
    # порты, не меняет владельцев файлов, не трогает системное время.
    cap_drop:
      - ALL

    # Запретить повышение прав через setuid-программы: даже найдя такую внутри
    # образа, процесс не сможет стать привилегированным.
    security_opt:
      - no-new-privileges:true

    # Лимиты, чтобы сбой в боте не утащил за собой весь сервер: бесконечный
    # цикл или утечка памяти упрутся в потолок, а не съедят машину целиком.
    mem_limit: 512m
    pids_limit: 128

    # Поднять контейнер после падения процесса и после перезагрузки сервера,
    # но не после ручной остановки (docker compose stop).
    restart: unless-stopped

    # По умолчанию Docker пишет логи без ограничений и со временем забивает
    # диск сервера. Держим три файла по 10 МБ.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Сколько ждать корректного завершения после SIGTERM, прежде чем убить.
    # Боту нужно закрыть соединение с базой, чтобы не повредить файл SQLite.
    stop_grace_period: 15s

# Портов нет намеренно: бот сам стучится в Telegram (long polling), входящие
# соединения ему не нужны. Меньше открытых дверей на сервере.
